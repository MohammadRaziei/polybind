[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polybind"
version = "0.1.0"
description = "Auto-generate unified Python wrappers for C++ template types (nanobind / pybind11 / Cython)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Mohammad Raziei", email = "mohammadraziei@gmail.com" },
]
keywords = ["binding", "nanobind", "pybind11", "cython", "cpp", "template", "wrapper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",   # tomllib backport (settings files)
]

[project.scripts]
polybind = "polybind.__main__:main"

[project.urls]
Homepage = "https://github.com/mohammadraziei/polybind"
Issues   = "https://github.com/mohammadraziei/polybind/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["polybind"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py38"                # = requires-python
extend-exclude = ["tests/data"]       # fixtures read by the stub parser, kept as they are

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
pythonpath = [ "." ]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source   = ["polybind"]
branch   = true                        # measure branch coverage too
parallel = false
omit     = [
    "polybind/__main__.py",            # CLI boilerplate; tested via subprocess
]

[tool.coverage.report]
show_missing   = true
skip_covered   = false
skip_empty     = true
precision      = 1
exclude_lines  = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict         = true
ignore_missing_imports = true
